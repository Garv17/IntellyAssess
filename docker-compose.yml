name: intellyassess

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_SECRET: ${JWT_SECRET}
  UPLOAD_DIR: /app/uploads
  CORS_ORIGINS: '["http://localhost:5180","http://localhost:8080"]'
  # Previously not wired through at all — .env overrides of these were silently
  # ignored and every judge container ran on Settings' Python defaults regardless.
  JUDGE_CPUS: ${JUDGE_CPUS:-1.0}
  JUDGE_MEMORY_MB: ${JUDGE_MEMORY_MB:-256}
  JUDGE_PIDS_LIMIT: ${JUDGE_PIDS_LIMIT:-64}
  JUDGE_COMPILE_TIMEOUT_SECONDS: ${JUDGE_COMPILE_TIMEOUT_SECONDS:-20}
  RUN_RATE_LIMIT_SECONDS: ${RUN_RATE_LIMIT_SECONDS:-20}
  # Warm container pool (app/services/judge_pool.py) — ships disabled. Only turn
  # this on after running the leak test in SCALING.md against this exact Docker
  # daemon/images.
  JUDGE_POOL_ENABLED: ${JUDGE_POOL_ENABLED:-false}
  JUDGE_POOL_SIZE_PER_LANGUAGE: ${JUDGE_POOL_SIZE_PER_LANGUAGE:-3}
  JUDGE_POOL_MEMORY_MB: ${JUDGE_POOL_MEMORY_MB:-512}
  JUDGE_POOL_SLOT_TTL_SECONDS: ${JUDGE_POOL_SLOT_TTL_SECONDS:-240}

x-backend-env-file: &backend-env-file
  - path: ./backend/.env
    required: false

services:
  # Explicit cpus/mem_limit on postgres/redis/backend below (all tunable via env)
  # reserve their share of the box regardless of what the judge queues are doing —
  # a Run/grading burst must degrade judge latency, never starve the API or DB.
  postgres:
    container_name: postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    mem_limit: ${POSTGRES_MEM_LIMIT:-1024m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    # appendfsync everysec bounds worst-case answer loss to ~1s if Redis dies.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    mem_limit: ${REDIS_MEM_LIMIT:-640m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    container_name: backend
    build: ./backend
    restart: unless-stopped
    env_file: *backend-env-file
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    mem_limit: ${BACKEND_MEM_LIMIT:-1024m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    container_name: worker
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -Q default -c 2 --loglevel=info
    env_file: *backend-env-file
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Overrides the backend image's baked-in HEALTHCHECK (curls localhost:8000,
    # which is only ever listening in the backend container) — this one actually
    # pings the worker running in this container.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  # Judge is split into two queues so a grading spike (e.g. 200 attempts hitting
  # their deadline at once) can never delay a student's interactive "Run" click:
  # judge_run gets the larger share of the judge CPU budget, judge_grade the rest.
  # Both need the Docker socket to spawn sandbox containers. Concurrency defaults
  # are conservative for a 4-vCPU box (2+1 sandbox containers at judge_cpus=1.0
  # each, leaving ~1 core for postgres/redis/backend/worker/beat) — raise
  # JUDGE_RUN_CONCURRENCY/JUDGE_GRADE_CONCURRENCY via .env on a bigger box, or move
  # these two services to a dedicated judge host pointed at this host's Redis/
  # Postgres (see SCALING.md) rather than raising them past what this box's
  # core count supports.
  judge_run:
    container_name: judge_run
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -Q judge_run -c ${JUDGE_RUN_CONCURRENCY:-2} --loglevel=info
    env_file: *backend-env-file
    environment: *backend-env
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # See the worker service above: this overrides the inherited backend healthcheck
    # with one that actually pings the worker running in this container.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  judge_grade:
    container_name: judge_grade
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -Q judge_grade -c ${JUDGE_GRADE_CONCURRENCY:-1} --loglevel=info
    env_file: *backend-env-file
    environment: *backend-env
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  beat:
    container_name: beat
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    env_file: *backend-env-file
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # celery beat has no "inspect ping" equivalent (it schedules, it doesn't answer
    # broker pings) — disable the inherited backend healthcheck rather than report a
    # false "unhealthy" against an endpoint that was never going to exist here.
    # Beat's liveness is what SETUP.md's "docker compose logs beat" check verifies.
    healthcheck:
      disable: true

  frontend:
    container_name: frontend
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5180:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:

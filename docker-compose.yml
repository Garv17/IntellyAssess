name: intellyassess
 
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://exam:${POSTGRES_PASSWORD:-exam}@postgres:5432/exam
  DATABASE_URL_SYNC: postgresql+psycopg://exam:${POSTGRES_PASSWORD:-exam}@postgres:5432/exam
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
  UPLOAD_DIR: /app/uploads
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:5180","http://localhost:8080"]'}
 
x-backend-env-file: &backend-env-file
  - path: ./backend/.env
    required: false
 
services:
  postgres:
    container_name: postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam}
      POSTGRES_DB: exam
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback: the api/worker containers reach Postgres over the
      # compose network regardless, so publishing this on 0.0.0.0 only exposes the
      # database (password "exam") to anything that can route to the host.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam"]
      interval: 5s
      timeout: 3s
      retries: 10
 
  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    # appendfsync everysec bounds worst-case answer loss to ~1s if Redis dies.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    ports:
      # Loopback only. Redis has no password here, and it holds queued evaluations
      # plus the autosave buffer — anything that can reach it can read or drop them.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
 
  backend:
    container_name: backend
    build: ./backend
    restart: unless-stopped
    env_file: *backend-env-file
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
 
  worker:
    container_name: worker
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -Q default -c 2 --loglevel=info
    env_file: *backend-env-file
    environment: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Overrides the backend image's baked-in HEALTHCHECK (curls localhost:8000,
    # which is only ever listening in the backend container) — this one actually
    # pings the worker running in this container.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
 
  ai-worker:
    container_name: ai-worker
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker -Q ai -c 4 --loglevel=info
    env_file: *backend-env-file
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # See the worker service above: this overrides the inherited backend healthcheck
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
 
  beat:
    container_name: beat
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    env_file: *backend-env-file
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
 
  frontend:
    container_name: frontend
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5180:80"
    depends_on:
      backend:
        condition: service_healthy
 
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
 
volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
 
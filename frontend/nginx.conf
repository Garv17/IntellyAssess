# Rate limits are the cheapest defence against a login stampede and a runaway
# auto-save loop. Sized above the design's expected per-student rates so a normal
# exam never trips them.
#
# `auth` is deliberately generous and keyed per-IP like everything else here, which
# matters because it isn't per-student: a school/office NAT puts dozens of students
# behind one public IP, and they all request their magic link (or refresh their
# 15-min access token) in the same narrow window at exam open. Per-student abuse is
# already capped at the app layer (Redis magic-link cooldown, single-session
# denylist), so this zone only needs to stop a genuine flood, not throttle a
# legitimate shared-IP classroom. `login` stays tight and is scoped to admin
# password login only, where brute-force protection actually matters.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Lets /api/ serve both plain HTTP and the Live Monitor WebSocket upgrade: Upgrade
# is only set (and Connection promoted to "upgrade") when the client actually asked
# for one, so ordinary requests keep today's Connection: "" behavior.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Exact match wins over the /api/auth/ prefix below regardless of file order, so
    # only this one endpoint gets the tight, brute-force-grade limit.
    location = /api/auth/admin/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $host drops the port; SEB's Config Key hash is computed against the
        # exact URL the client requested (including port), so this must match
        # exactly or every SEB-gated request 403s.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        limit_req zone=auth burst=100 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough that the Live Monitor WebSocket isn't killed between its
        # 25s app-level pings; harmless for ordinary short-lived requests.
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        expires 7d;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
}
